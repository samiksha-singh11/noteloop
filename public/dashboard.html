<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NoteLoop · Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="navbar">
    <div class="brand-header">
      <svg class="brand-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
      </svg>
      <span class="brand-name">noteloop</span>
    </div>
    <div class="user-info">
      <span id="userEmail"></span>
      <button id="logoutBtn">Log out</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="browse">Browse Resources</button>
    <button class="tab" data-tab="upload" id="uploadTab">Upload Resource</button>
  </nav>

  <!-- Browse Tab -->
  <section id="browse" class="tab-content active">
    <div class="filters">
      <select id="filterBranch">
        <option value="">All Branches</option>
        <option>CSE</option><option>ECE</option>
        <option>ME</option><option>CE</option>
      </select>
      <input type="text" id="filterSubject" placeholder="Search subject..." style="padding: 0.6rem 1rem; border: 1px solid var(--border-soft); border-radius: 6px; outline: none;">
      <select id="filterSemester">
        <option value="">All Semesters</option>
        <option>1</option><option>2</option><option>3</option>
        <option>4</option><option>5</option><option>6</option>
        <option>7</option><option>8</option>
      </select>
      <select id="filterType">
        <option value="">All Types</option>
        <option>Notes</option><option>PYQs</option>
      </select>
      <button id="applyFilters">Apply Filters</button>
      <button id="resetFilters">Reset</button>
    </div>

    <div id="notesGrid" class="notes-grid"></div>
  </section>

  <!-- Upload Tab -->
  <section id="upload" class="tab-content">
    <div class="upload-card">
      <h3>Upload a Resource</h3>

      <label>1. Branch</label>
      <select id="branch">
        <option value="">Select Branch</option>
        <option>CSE</option><option>ECE</option>
        <option>ME</option><option>CE</option>
      </select>

      <label>2. Subject Name</label>
      <input type="text" id="subject" placeholder="e.g. Data Structures" />

      <label>3. Title</label>
      <input type="text" id="title" placeholder="e.g. Mid-Sem Notes" />

      <label>4. Resource Type</label>
      <select id="type">
        <option value="Notes">Notes</option>
        <option value="PYQs">PYQs</option>
      </select>

      <label>5. Semester</label>
      <select id="semester">
        <option value="1">Semester 1</option>
        <option value="2">Semester 2</option>
        <option value="3">Semester 3</option>
        <option value="4">Semester 4</option>
        <option value="5">Semester 5</option>
        <option value="6">Semester 6</option>
        <option value="7">Semester 7</option>
        <option value="8">Semester 8</option>
      </select>

      <label>6. Upload File</label>
      <div class="file-drop-zone" id="fileDropZone">
        <input type="file" id="fileInput" />
        <div class="file-drop-icon">&#128196;</div>
        <div class="file-drop-text" id="fileDropText">
          <strong>Click to browse</strong> or drag & drop
        </div>
        <div class="file-selected" id="fileName"></div>
      </div>

      <button id="uploadBtn">Upload Resource</button>
    </div>
  </section>

  <script src="js/toast.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
