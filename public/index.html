<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NoteLoop · Login</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="login-body">
  <div class="login-card">
    <div class="logo">
      <span class="logo-icon">📚</span>
      <h1>NoteLoop</h1>
    </div>
    <p class="subtitle">Senior-to-Junior Academic Sharing Platform</p>

    <!-- Tab buttons -->
    <div class="auth-tabs">
      <button id="tabLogin" class="auth-tab active">Login</button>
      <button id="tabSignup" class="auth-tab">Sign Up</button>
    </div>

    <!-- LOGIN FORM -->
    <div id="loginForm">
      <input type="email" id="loginEmail" placeholder="Email (e.g. 2025xxx@ug.sharda.ac.in)" />
      <input type="password" id="loginPassword" placeholder="Password" />

      <button id="loginBtn">Login →</button>
    </div>

    <!-- SIGNUP FORM -->
    <div id="signupForm" style="display:none;">
      <input type="email" id="signupEmail" placeholder="Email (e.g. 2025xxx@ug.sharda.ac.in)" />
      <input type="password" id="signupPassword" placeholder="Choose a password (min 6 chars)" />

      <select id="signupRole">
        <option value="junior">🎓 Junior Student (Access Resources)</option>
        <option value="senior">✍️ Senior Student (Upload Resources)</option>
      </select>

      <button id="signupBtn">Create Account →</button>
    </div>

    <p class="demo">
      Use your <strong>Sharda University email</strong> or a Gmail account to sign up.
    </p>
  </div>

  <script src="js/toast.js"></script>
<script src="js/login.js"></script>
</body>
</html>
