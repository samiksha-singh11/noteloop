<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NoteLoop · Login</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="login-body">
  <div class="login-card">
    <div class="logo">
      <span class="logo-icon">📚</span>
      <h1>NoteLoop</h1>
    </div>
    <p class="subtitle">Senior-to-Junior Academic Sharing Platform</p>

    <input type="email" id="email" placeholder="Enter your college email" />
    <select id="role">
      <option value="junior">🎓 Junior Student (Access Resources)</option>
      <option value="senior">✍️ Senior Student (Upload Resources)</option>
    </select>

    <button id="loginBtn">Login →</button>

    <p class="demo">
      Demo accounts:<br>
      <small>student@college.edu | senior@college.edu</small>
    </p>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
